<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract concentric aperture study">
  <rect width="1200" height="800" fill="#0f1113"/>
  <g transform="translate(600 400)">
    <g fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
      <circle r="120"/><circle r="180"/><circle r="240"/><circle r="300"/><circle r="360"/><circle r="420"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1">
      <line x1="0" y1="-440" x2="0" y2="440"/>
      <line x1="-440" y1="0" x2="440" y2="0"/>
      <line x1="-311" y1="-311" x2="311" y2="311"/>
      <line x1="311" y1="-311" x2="-311" y2="311"/>
    </g>
    <circle r="240" fill="none" stroke="#2e7bff" stroke-width="2.5" stroke-dasharray="360 1200"
      transform="rotate(-30)"/>
    <circle r="6" fill="#2e7bff"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <circle cx="180" cy="0" r="3"/><circle cx="-180" cy="0" r="3"/>
      <circle cx="0" cy="-240" r="3"/>
    </g>
  </g>
</svg>
