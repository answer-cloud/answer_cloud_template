<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstract layered strata section">
  <rect width="1200" height="800" fill="#f7f8f9"/>
  <defs>
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#1a1b1c" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <pattern id="hatch2" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0058ef" stroke-opacity="0.4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="150" fill="#eef0f2"/>
  <rect x="0" y="150" width="1200" height="120" fill="url(#hatch)"/>
  <rect x="0" y="270" width="1200" height="90" fill="#e7e9ec"/>
  <rect x="0" y="360" width="1200" height="110" fill="url(#hatch2)"/>
  <rect x="0" y="470" width="1200" height="140" fill="#e7e9ec"/>
  <rect x="0" y="610" width="1200" height="190" fill="url(#hatch)"/>
  <g stroke="#1a1b1c" stroke-opacity="0.45" stroke-width="1.5">
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="610" x2="1200" y2="610"/>
  </g>
  <g stroke="#0058ef" stroke-width="2">
    <line x1="0" y1="360" x2="1200" y2="360"/>
  </g>
</svg>
